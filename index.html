<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clara | IA Pessoal</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>

    <style>
        :root {
            --bg: #ffffff;
            --sidebar: #f0f4f9;
            --text: #1f1f1f;
            --border: #e3e3e3;
            --user-bubble: #f0f4f9;
            --active-chat: #dde3ea;
            --clara-gradient: linear-gradient(70deg, #4285f4, #9b72cb, #d96570);
            --danger: #d93025;
        }

        [data-theme="dark"] {
            --bg: #131314;
            --sidebar: #1e1f20;
            --text: #e3e3e3;
            --border: #3c4043;
            --user-bubble: #282a2c;
            --active-chat: #2a2b2d;
            --danger: #f28b82;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Google Sans', sans-serif; background: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden; }

        /* Sidebar */
        #sidebar { width: 300px; background: var(--sidebar); padding: 15px; display: flex; flex-direction: column; border-right: 1px solid var(--border); transition: 0.3s; }
        
        .btn-sidebar { border: none; padding: 12px 18px; border-radius: 50px; cursor: pointer; display: flex; align-items: center; gap: 12px; font-weight: 500; transition: 0.2s; width: 100%; font-size: 14px; font-family: inherit; margin-bottom: 8px; }
        
        .btn-new { background: #dde3ea; color: #1f1f1f; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        [data-theme="dark"] .btn-new { background: #333; color: white; }
        .btn-new:hover { filter: brightness(0.95); transform: translateY(-1px); }

        .btn-delete { background: transparent; color: var(--danger); margin-top: auto; }
        .btn-delete:hover { background: rgba(217, 48, 37, 0.1); }

        .history-list { flex: 1; overflow-y: auto; margin-top: 15px; }
        .hist-item { 
            display: flex; align-items: center; justify-content: space-between;
            padding: 10px 14px; border-radius: 12px; cursor: pointer; font-size: 14px; 
            color: var(--text); opacity: 0.85; transition: 0.2s; margin-bottom: 4px;
        }
        .hist-item:hover { background: var(--border); opacity: 1; }
        .hist-item.active { background: var(--active-chat); font-weight: 500; opacity: 1; }
        
        .hist-title { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-right: 8px; }
        .btn-del-chat { opacity: 0; transition: 0.2s; padding: 4px; border-radius: 4px; }
        .hist-item:hover .btn-del-chat { opacity: 0.6; }
        .btn-del-chat:hover { opacity: 1 !important; color: var(--danger); }

        /* Main Area */
        #main { flex: 1; display: flex; flex-direction: column; position: relative; background: var(--bg); }
        
        header { 
            padding: 15px 40px; display: flex; justify-content: space-between; align-items: center; 
            background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(10px); z-index: 5;
        }
        [data-theme="dark"] header { background: rgba(19, 19, 20, 0.7); }

        #chat-window { flex: 1; overflow-y: auto; padding: 20px 18% 120px; scroll-behavior: smooth; }

        /* Clara Avatar & Chat UI */
        .clara-orb {
            width: 35px; height: 35px; border-radius: 50%; background: var(--clara-gradient);
            background-size: 200% 200%; flex-shrink: 0; margin-right: 20px;
            animation: orbFloat 4s infinite ease-in-out;
            box-shadow: 0 4px 10px rgba(66, 133, 244, 0.3);
        }
        @keyframes orbFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); filter: hue-rotate(20deg); } }

        .msg-container { display: flex; flex-direction: column; margin-bottom: 35px; animation: slideUp 0.3s ease; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        .user-row { align-self: flex-end; max-width: 80%; background: var(--user-bubble); padding: 14px 22px; border-radius: 22px 22px 4px 22px; line-height: 1.6; }
        .ai-row { align-self: flex-start; display: flex; width: 100%; }
        .ai-text { flex: 1; line-height: 1.7; font-size: 16px; color: var(--text); }
        .ai-text img { max-width: 100%; border-radius: 16px; margin: 15px 0; box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: block; }

        /* Typing Dots */
        .dots { display: inline-flex; gap: 5px; align-items: center; height: 24px; }
        .dot { width: 8px; height: 8px; background: #888; border-radius: 50%; animation: pulse 1.4s infinite ease-in-out; }
        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes pulse { 0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; } 40% { transform: scale(1); opacity: 1; } }

        /* Input Area */
        .input-area { 
            position: absolute; bottom: 0; left: 0; right: 0; padding: 20px 18% 30px; 
            background: linear-gradient(transparent, var(--bg) 60%);
        }
        .input-pill { 
            background: var(--user-bubble); border-radius: 35px; padding: 12px 24px; 
            display: flex; align-items: center; gap: 15px; border: 1px solid transparent; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.05); transition: 0.3s;
        }
        .input-pill:focus-within { border-color: #4285f4; background: var(--bg); box-shadow: 0 8px 25px rgba(0,0,0,0.1); }
        
        textarea { flex: 1; border: none; outline: none; background: transparent; color: var(--text); font-size: 16px; resize: none; max-height: 180px; font-family: inherit; }
        
        .btn-icon { background: transparent; border: none; cursor: pointer; font-size: 18px; color: var(--text); opacity: 0.7; transition: 0.2s; }
        .btn-icon:hover { opacity: 1; transform: scale(1.05); }

        .mic-active { color: #ea4335 !important; opacity: 1 !important; animation: pulseRed 1s infinite; }
        @keyframes pulseRed { 0% { transform: scale(1); } 50% { transform: scale(1.2); } 100% { transform: scale(1); } }

        /* Welcome Hero */
        .welcome-hero { margin-top: 8vh; }
        .welcome-hero h1 { font-size: 56px; font-weight: 500; background: var(--clara-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: -1px; }
        .welcome-hero h2 { font-size: 56px; color: #c4c7c5; margin-top: -10px; }
    </style>
</head>
<body>

    <aside id="sidebar">
        <button class="btn-sidebar btn-new" onclick="createNewChat()">
            <i class="fa-solid fa-plus"></i> Novo chat
        </button>

        <div class="history-list" id="history-list"></div>
        
        <button class="btn-sidebar" onclick="toggleTheme()" style="background: transparent; color: var(--text);">
            <i class="fa-solid fa-circle-half-stroke"></i> Tema
        </button>

        <button class="btn-sidebar btn-delete" onclick="limparTudo()">
            <i class="fa-solid fa-trash-can"></i> Limpar tudo
        </button>
    </aside>

    <main id="main">
        <header>
            <div style="font-weight: 700; font-size: 20px; letter-spacing: -0.5px;">Clara <span style="font-weight: 400; opacity: 0.5;">IA</span></div>
            <div id="clock" style="font-variant-numeric: tabular-nums; opacity: 0.6;"></div>
        </header>

        <div id="chat-window"></div>

        <div class="input-area">
            <div class="input-pill">
                <textarea id="userInput" placeholder="Escreva ou fale sua mensagem..." rows="1"></textarea>
                <button class="btn-icon" id="mic-btn" onclick="useMic()" title="Falar por microfone"><i class="fa-solid fa-microphone"></i></button>
                <button class="btn-icon" onclick="sendMsg()" style="color: #4285f4; opacity: 1;" title="Enviar mensagem"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        </div>
    </main>

<script>
    const API_KEY = "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";
    const chatWin = document.getElementById('chat-window');
    const input = document.getElementById('userInput');
    const historyList = document.getElementById('history-list');
    const micBtn = document.getElementById('mic-btn');

    let chats = JSON.parse(localStorage.getItem('clara_v6_chats')) || [];
    let currentChatId = localStorage.getItem('clara_v6_current_id') || null;

    window.onload = () => {
        updateTime();
        if (chats.length === 0) {
            createNewChat();
        } else {
            if (!currentChatId || !chats.find(c => c.id === currentChatId)) {
                currentChatId = chats[0].id;
            }
            loadCurrentChat();
            renderHistory();
        }
    };

    function saveState() {
        localStorage.setItem('clara_v6_chats', JSON.stringify(chats));
        localStorage.setItem('clara_v6_current_id', currentChatId);
    }

    function getGreetingText() {
        const h = new Date().getHours();
        return h < 12 ? "Bom dia!" : h < 18 ? "Boa tarde!" : "Boa noite!";
    }

    function createNewChat() {
        const newId = 'chat_' + Date.now();
        const newChat = {
            id: newId,
            title: 'Nova conversa',
            messages: []
        };
        chats.unshift(newChat);
        currentChatId = newId;
        saveState();
        renderHistory();
        loadCurrentChat();
    }

    function getCurrentChat() {
        return chats.find(c => c.id === currentChatId);
    }

    function loadCurrentChat() {
        chatWin.innerHTML = '';
        const current = getCurrentChat();
        
        if (!current || current.messages.length === 0) {
            chatWin.innerHTML = `
                <div id="welcome-box" class="welcome-hero">
                    <h1>${getGreetingText()}</h1>
                    <h2>Eu sou a Clara.</h2>
                    <p style="margin-top: 20px; font-size: 18px; color: #888; max-width: 500px;">Sua assistente inteligente, pronta para criar, solucionar e organizar seu dia com neutralidade e precisão.</p>
                </div>`;
        } else {
            current.messages.forEach(m => addBubbleUI(m.role, m.content));
        }
    }

    function switchChat(id) {
        currentChatId = id;
        saveState();
        renderHistory();
        loadCurrentChat();
    }

    function deleteChat(id, event) {
        event.stopPropagation();
        chats = chats.filter(c => c.id !== id);
        if (chats.length === 0) {
            createNewChat();
        } else {
            if (currentChatId === id) {
                currentChatId = chats[0].id;
            }
            saveState();
            renderHistory();
            loadCurrentChat();
        }
    }

    function limparTudo() {
        if(confirm("Deseja apagar TODO o seu histórico de conversas permanentemente?")) {
            chats = [];
            localStorage.removeItem('clara_v6_chats');
            localStorage.removeItem('clara_v6_current_id');
            createNewChat();
        }
    }

    function renderHistory() {
        historyList.innerHTML = '<p style="font-size: 11px; font-weight: bold; color: #888; margin: 0 0 10px 10px; letter-spacing: 1px;">HISTÓRICO</p>';
        chats.forEach(chat => {
            const div = document.createElement('div');
            div.className = `hist-item ${chat.id === currentChatId ? 'active' : ''}`;
            div.onclick = () => switchChat(chat.id);
            div.innerHTML = `
                <i class="fa-regular fa-message" style="margin-right:10px; opacity:0.7;"></i>
                <span class="hist-title">${chat.title}</span>
                <i class="fa-solid fa-trash-can btn-del-chat" onclick="deleteChat('${chat.id}', event)" title="Excluir"></i>
            `;
            historyList.appendChild(div);
        });
    }

    function updateTime() {
        document.getElementById('clock').innerText = new Date().toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'});
        setTimeout(updateTime, 1000);
    }

    function toggleTheme() {
        document.body.dataset.theme = document.body.dataset.theme === 'dark' ? 'light' : 'dark';
    }

    function useMic() {
        const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!Rec) {
            alert("Reconhecimento de voz não é suportado pelo seu navegador.");
            return;
        }
        const r = new Rec();
        r.lang = 'pt-BR';
        r.interimResults = false;

        r.onstart = () => micBtn.classList.add('mic-active');
        r.onend = () => micBtn.classList.remove('mic-active');
        r.onerror = () => micBtn.classList.remove('mic-active');
        r.onresult = (e) => {
            input.value = e.results[0][0].transcript;
            sendMsg();
        };
        r.start();
    }

    function addBubbleUI(role, content) {
        const welcome = document.getElementById('welcome-box');
        if (welcome) welcome.remove();

        const container = document.createElement('div');
        container.className = 'msg-container';
        const isAI = role === 'assistant';

        container.innerHTML = isAI ? `
            <div class="ai-row">
                <div class="clara-orb"></div>
                <div class="ai-text">${marked.parse(content)}</div>
            </div>` : `<div class="user-row">${content}</div>`;

        chatWin.appendChild(container);
        chatWin.scrollTop = chatWin.scrollHeight;
        hljs.highlightAll();
    }

    function addLoadingBubble() {
        const container = document.createElement('div');
        container.className = 'msg-container';
        container.id = 'loading-bubble';
        container.innerHTML = `
            <div class="ai-row">
                <div class="clara-orb"></div>
                <div class="ai-text">
                    <div class="dots">
                        <div class="dot"></div>
                        <div class="dot"></div>
                        <div class="dot"></div>
                    </div>
                </div>
            </div>`;
        chatWin.appendChild(container);
        chatWin.scrollTop = chatWin.scrollHeight;
    }

    function removeLoadingBubble() {
        const el = document.getElementById('loading-bubble');
        if (el) el.remove();
    }

    async function sendMsg() {
        const text = input.value.trim();
        if(!text) return;

        const current = getCurrentChat();
        if (!current) return;

        if (current.messages.length === 0) {
            current.title = text.length > 24 ? text.substring(0, 24) + '...' : text;
        }

        addBubbleUI('user', text);
        current.messages.push({ role: 'user', content: text });
        saveState();
        renderHistory();

        input.value = ''; 
        input.style.height = 'auto';

        addLoadingBubble();

        const systemPrompt = `Você é a Clara, uma inteligência artificial altamente culta, imparcial e livre de pré-conceitos ou barreiras étnico-culturais.
Suas respostas devem ser baseadas em dados científicos, literários, acadêmicos e fontes bibliográficas confiáveis.
É ESTRITAMENTE PROIBIDO citar ou utilizar a Wikipédia como referência.
Quando oportuno ou solicitado para ilustrar conceitualmente uma resposta, inclua uma imagem relevante em formato Markdown exatamente assim:
![Descrição da imagem](https://image.pollinations.ai/prompt/description_in_english_separated_by_hyphens?width=800&height=500&nologo=true)
Responda sempre em português claro, objetivo e elegante.`;

        try {
            const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST",
                headers: { 
                    "Authorization": `Bearer ${API_KEY}`, 
                    "Content-Type": "application/json" 
                },
                body: JSON.stringify({
                    model: "llama-3.1-8b-instant",
                    messages: [
                        { role: "system", content: systemPrompt }, 
                        ...current.messages.slice(-10)
                    ],
                    temperature: 0.7
                })
            });

            removeLoadingBubble();

            if (!res.ok) {
                const errBody = await res.json().catch(() => ({}));
                const msg = errBody.error?.message || `Erro HTTP ${res.status}`;
                throw new Error(msg);
            }

            const data = await res.json();
            const reply = data.choices[0].message.content;

            addBubbleUI('assistant', reply);
            current.messages.push({ role: 'assistant', content: reply });
            saveState();
        } catch (e) {
            removeLoadingBubble();
            console.error("Erro completo:", e);
            addBubbleUI('assistant', `⚠️ **Aviso de Conexão:** ${e.message}`);
        }
    }

    input.oninput = function() { this.style.height = 'auto'; this.style.height = this.scrollHeight + 'px'; };
    input.onkeydown = (e) => { if(e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(); } };
</script>
</body>
</html>
